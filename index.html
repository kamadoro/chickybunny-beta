<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terraria Pixel Shooter</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #1a252c; font-family: 'Courier New', Courier, monospace; user-select: none; touch-action: none; }
        canvas { display: block; cursor: crosshair; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; display: none; flex-direction: column; gap: 5px; z-index: 5; }
        #ui span { color: #f1c40f; }
        #eraUI span { color: #ff6b6b; }
        #pinocchioUI { color: #e67e22; display: none; }
        #godModeIndicator { color: #ff00ff; display: none; }
        .top-btn { position: absolute; right: 15px; color: white; border: 3px solid #000; padding: 10px 15px; font-size: 16px; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 0 #000; z-index: 10; cursor: pointer; font-family: inherit; display: none; width: 130px; text-align: center; }
        .top-btn:active { transform: translateY(4px); box-shadow: none; }
        #shopBtn { top: 15px; background: #3498db; }
        #upgradeBtn { top: 65px; background: #e67e22; }
        #compUpgradeBtn { top: 115px; background: #9b59b6; }
        #awpAutoBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #e74c3c; color: white; border: 3px solid #000; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 10px; box-shadow: 0 4px 0 #000; z-index: 20; cursor: pointer; font-family: inherit; display: none; }
        #awpAutoBtn:active { transform: translate(-50%, 4px); box-shadow: none; }
        #warning { position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%); color: #ff0000; font-size: 40px; font-weight: bold; text-align: center; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; display: none; z-index: 100; pointer-events: none; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); } to { transform: (-50%, -50%) scale(1.1); } }
        #eraPopup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.92); border: 4px solid #ff6b6b; border-radius: 15px; padding: 30px 50px; color: white; text-align: center; z-index: 105; pointer-events: none; display: none; box-shadow: 0 0 40px rgba(255, 107, 107, 0.7); animation: eraPulse 0.6s ease-out; }
        #eraPopup h1 { margin: 0 0 15px 0; color: #ff6b6b; font-size: 48px; text-shadow: 3px 3px 0 #000; }
        #eraPopup .subtitle { font-size: 18px; margin-bottom: 15px; color: #f1c40f; }
        #eraPopup .unlock { font-size: 20px; margin: 5px 0; color: #2ecc71; }
        @keyframes eraPulse { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        #mainMenu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #2e4d27; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; touch-action: manipulation; }
        #mainMenu h1 { color: #e74c3c; text-shadow: 4px 4px 0 #000; font-size: 38px; text-align: center; margin-bottom: 20px; }
        #mainMenu button { width: 250px; padding: 15px 0; margin: 8px; font-size: 20px; font-weight: bold; font-family: inherit; border: 4px solid #000; border-radius: 10px; box-shadow: 0 6px 0 #000; cursor: pointer; touch-action: manipulation; }
        #mainMenu button:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
        #playBtn { background: #2ecc71; color: white; }
        #menuShopBtn { background: #f1c40f; color: #000; }
        #cheatBtn { background: #9b59b6; color: white; }
        #difficultyBtn { background: #f39c12; color: white; }
        #deviceBtn { background: #3498db; color: white; font-size: 18px; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: rgba(20, 25, 30, 0.98); border: 4px solid #f1c40f; border-radius: 10px; padding: 20px; display: none; flex-direction: column; gap: 10px; z-index: 60; color: white; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-height: 80vh; overflow-y: auto; }
        .modal h2 { margin: 0 0 10px 0; text-align: center; color: #f1c40f; font-size: 24px; }
        .item { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 10px; border-radius: 5px; border: 1px solid #555; }
        .item.locked { opacity: 0.4; }
        .item button { padding: 8px 12px; font-family: inherit; font-weight: bold; font-size: 14px; border: 2px solid #000; border-radius: 5px; cursor: pointer; }
        .btn-buy { background: #e67e22; color: white; }
        .btn-equip { background: #2ecc71; color: white; }
        .btn-equipped { background: #7f8c8d; color: #ccc; cursor: not-allowed; }
        .close-btn { margin-top: 10px; padding: 12px; background: #e74c3c; color: white; border: 3px solid #000; font-weight: bold; font-family: inherit; font-size: 18px; border-radius: 5px; cursor: pointer; }
        .cheat-input { width: 100%; padding: 14px 12px; font-family: inherit; font-size: 20px; background: #1a252c; color: #fff; border: 3px solid #f1c40f; border-radius: 5px; text-align: center; letter-spacing: 3px; box-sizing: border-box; outline: none; }
        .cheat-input:focus { border-color: #fff; box-shadow: 0 0 15px rgba(241, 196, 15, 0.7); }
        #cheatSubmitBtn { padding: 14px; background: #9b59b6; color: white; border: 3px solid #000; font-weight: bold; font-family: inherit; font-size: 18px; border-radius: 5px; cursor: pointer; box-shadow: 0 4px 0 #000; }
        #cheatSubmitBtn:active { transform: translateY(4px); box-shadow: none; }
        #deathScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6vh; box-sizing: border-box; z-index: 15; pointer-events: none; }
        #deathScreen img { max-height: 42vh; max-width: 90vw; object-fit: contain; image-rendering: pixelated; animation: deathPulse 2s ease-in-out infinite alternate; }
        @keyframes deathPulse { from { filter: brightness(0.9) drop-shadow(0 0 20px rgba(255, 0, 0, 0.5)); transform: scale(0.98); } to { filter: brightness(1.2) drop-shadow(0 0 45px rgba(255, 0, 0, 0.9)); transform: scale(1.02); } }
        #resumeOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 14; pointer-events: none; color: white; font-size: 34px; font-weight: bold; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
        #restartBtn, #mainMenuBtn { position: absolute; left: 50%; transform: translateX(-50%); padding: 15px 30px; font-size: 20px; color: white; border: 3px solid #000; border-radius: 10px; cursor: pointer; display: none; font-family: inherit; font-weight: bold; box-shadow: 0 5px 0 #000; z-index: 20; }
        #restartBtn { top: 55%; background: #e74c3c; }
        #mainMenuBtn { top: 67%; background: #3498db; }
    </style>
</head>
<body>
    <div id="warning">ВНИМАНИЕ:<br>СТРАШНЫЙ ВРАГ!</div>
    <div id="eraPopup">
        <h1 id="eraTitle">ЭРА 2</h1>
        <div class="subtitle">Враг стал сильнее...</div>
        <div id="eraUnlocks"></div>
    </div>
    <div id="mainMenu">
        <h1>ЛЕСНЫЕ<br>МОНСТРЫ</h1>
        <button id="playBtn">ИГРАТЬ</button>
        <button id="menuShopBtn">МАГАЗИН</button>
        <button id="difficultyBtn">СЛОЖНОСТЬ: СРЕДНЯЯ</button>
        <button id="deviceBtn">УСТРОЙСТВО: АВТО</button>
        <button id="cheatBtn">ЧИТ-КОДЫ</button>
    </div>
    <div id="ui">
        <div>HP: <span id="hp">100</span> (<span id="shield" style="color:#3498db;">0</span> Щит)</div>
        <div>Убито: <span id="score">0</span></div>
        <div>Монеты: <span id="coins">0</span></div>
        <div id="eraUI">ЭРА: <span id="era">1</span></div>
        <div>Оружие: <span id="currentWeapon">Пистолет</span></div>
        <div id="pinocchioUI">Димас: <span id="pinoPieces">0</span>/7</div>
        <div id="godModeIndicator">РЕЖИМ БОГА</div>
    </div>
    <button id="shopBtn" class="top-btn">МАГАЗИН</button>
    <button id="upgradeBtn" class="top-btn">ПРОКАЧКА</button>
    <button id="compUpgradeBtn" class="top-btn">КОМПАНЬОН</button>
    <button id="awpAutoBtn">АВТО: ВЫКЛ</button>
    <div id="shopMenu" class="modal"><h2>МАГАЗИН ОРУЖИЯ</h2><div id="shopItems"></div><button class="close-btn" onclick="closeModals()">ЗАКРЫТЬ</button></div>
    <div id="upgradeMenu" class="modal"><h2>ПРОКАЧКА ГЕРОЯ</h2><div id="upgradeItems"></div><button class="close-btn" onclick="closeModals()">ЗАКРЫТЬ</button></div>
    <div id="compUpgradeMenu" class="modal"><h2>ПРОКАЧКА КОМПАНЬОНА</h2><div id="compUpgradeItems"></div><button class="close-btn" onclick="closeModals()">ЗАКРЫТЬ</button></div>
    <div id="cheatMenu" class="modal">
        <h2>ЧИТ-КОДЫ</h2>
        <input id="cheatInput" class="cheat-input" type="text" placeholder="ВВЕДИТЕ КОД..." autocomplete="off" spellcheck="false">
        <button id="cheatSubmitBtn">ПОДТВЕРДИТЬ</button>
        <button class="close-btn" onclick="closeCheatModal()">ОТМЕНА</button>
    </div>
    <div id="resumeOverlay">ПРИГОТОВЬСЯ...</div>
    <div id="deathScreen"><img src="https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/file_00000000bab881f4a9f0d56bbfa90ac6.png" alt="Death"></div>
    <button id="restartBtn">ЗАНОВО</button>
    <button id="mainMenuBtn">В МЕНЮ</button>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = false;

        const mainMenu = document.getElementById('mainMenu');
        const playBtn = document.getElementById('playBtn');
        const menuShopBtn = document.getElementById('menuShopBtn');
        const cheatBtn = document.getElementById('cheatBtn');
        const difficultyBtn = document.getElementById('difficultyBtn');
        const deviceBtn = document.getElementById('deviceBtn');
        const uiHp = document.getElementById('hp');
        const uiShield = document.getElementById('shield');
        const uiScore = document.getElementById('score');
        const uiCoins = document.getElementById('coins');
        const uiWeapon = document.getElementById('currentWeapon');
        const uiEra = document.getElementById('era');
        const uiContainer = document.getElementById('ui');
        const godModeIndicator = document.getElementById('godModeIndicator');
        const pinocchioUI = document.getElementById('pinocchioUI');
        const pinoPiecesUI = document.getElementById('pinoPieces');
        const deathScreen = document.getElementById('deathScreen');
        const resumeOverlay = document.getElementById('resumeOverlay');
        const eraPopup = document.getElementById('eraPopup');
        const eraTitle = document.getElementById('eraTitle');
        const eraUnlocks = document.getElementById('eraUnlocks');
        const restartBtn = document.getElementById('restartBtn');
        const mainMenuBtn = document.getElementById('mainMenuBtn');
        const shopBtn = document.getElementById('shopBtn');
        const shopMenu = document.getElementById('shopMenu');
        const shopItems = document.getElementById('shopItems');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const upgradeMenu = document.getElementById('upgradeMenu');
        const upgradeItems = document.getElementById('upgradeItems');
        const compUpgradeBtn = document.getElementById('compUpgradeBtn');
        const compUpgradeMenu = document.getElementById('compUpgradeMenu');
        const compUpgradeItems = document.getElementById('compUpgradeItems');
        const awpAutoBtn = document.getElementById('awpAutoBtn');
        const warningScreen = document.getElementById('warning');
        const cheatMenu = document.getElementById('cheatMenu');
        const cheatInput = document.getElementById('cheatInput');
        const cheatSubmitBtn = document.getElementById('cheatSubmitBtn');

        let era = 1;
        let bossKills = 0;

        let inputMode = 'auto';
        const deviceOrder = ['auto', 'pc', 'mobile'];
        const deviceLabels = { auto: 'УСТРОЙСТВО: АВТО', pc: 'УСТРОЙСТВО: ПК', mobile: 'УСТРОЙСТВО: ТЕЛЕФОН' };
        let usePcControls = true;
        let useTouchControls = true;

        function applyInputMode() {
            if (inputMode === 'pc') { usePcControls = true; useTouchControls = false; }
            else if (inputMode === 'mobile') { usePcControls = false; useTouchControls = true; }
            else { usePcControls = true; useTouchControls = true; }
            canvas.style.cursor = usePcControls ? 'crosshair' : 'none';
        }
        applyInputMode();

        deviceBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let idx = deviceOrder.indexOf(inputMode);
            idx = (idx + 1) % deviceOrder.length;
            inputMode = deviceOrder[idx];
            deviceBtn.textContent = deviceLabels[inputMode];
            applyInputMode();
        });

        let difficulty = 'medium';
        const difficultyOrder = ['medium', 'easy', 'impossible'];
        const difficultySettings = {
            easy:       { hpMult: 0.5, speedMult: 0.5,  rewardMult: 1.5, dmgMult: 1, name: 'ЛЁГКАЯ',      color: '#2ecc71' },
            medium:     { hpMult: 1,   speedMult: 1,    rewardMult: 1,   dmgMult: 1, name: 'СРЕДНЯЯ',     color: '#f39c12' },
            impossible: { hpMult: 2,   speedMult: 1.25, rewardMult: 1,   dmgMult: 2, name: 'НЕВОЗМОЖНАЯ', color: '#c0392b' }
        };

        let width, height;
        const BASE_ZOOM = 0.55;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            aimJoy.baseX = width - 100;
            aimJoy.baseY = height - 100;
        }
        window.addEventListener('resize', resize);

        const rabbitImage = new Image(); rabbitImage.crossOrigin = "Anonymous"; rabbitImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/yU7CzX.gif';
        const wolfImage = new Image(); wolfImage.crossOrigin = "Anonymous"; wolfImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/1792926401476.png';
        const playerImage = new Image(); playerImage.crossOrigin = "Anonymous"; playerImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/file_00000000c1e8822facd8a7dc2271a413.png';
        const monkeyImage = new Image(); monkeyImage.crossOrigin = "Anonymous"; monkeyImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/monkeyman4.png';
        const treeImage = new Image(); treeImage.crossOrigin = "Anonymous"; treeImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/_token-editor_token-uploads_plant_awakenedtree2_2026-10-25T13_15_36.896Z.png';
        const dimasImage = new Image(); dimasImage.crossOrigin = "Anonymous"; dimasImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/1792935549061.png';
        const bossImage = new Image(); bossImage.crossOrigin = "Anonymous"; bossImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/1792938598143.png';
        const foxImage = new Image(); foxImage.crossOrigin = "Anonymous"; foxImage.src = 'https://cdn.jsdelivr.net/gh/kamadoro/yaitsa@main/1792939792918.png';

        const weapons = {
            pistol:  { name: 'Пистолет',  damage: 1,   speed: 15, cooldown: 15, color: '#f1c40f', cost: 0,     owned: true,  size: 6,  eraReq: 1 },
            deagle:  { name: 'Дигл',      damage: 4,   speed: 20, cooldown: 25, color: '#e67e22', cost: 500,   owned: false, size: 7,  eraReq: 1 },
            rifle:   { name: 'Автомат',   damage: 1.5, speed: 22, cooldown: 5,  color: '#e74c3c', cost: 1000,  owned: false, size: 5,  eraReq: 1 },
            awp:     { name: 'AWP',       damage: 15,  speed: 35, cooldown: 60, color: '#3498db', cost: 5000,  owned: false, size: 9,  eraReq: 1, pierce: true },
            shotgun: { name: 'Дробовик',  damage: 3,   speed: 18, cooldown: 40, color: '#ff8800', cost: 8000,  owned: false, size: 5,  eraReq: 2, spread: true, pellets: 5, spreadAngle: 0.28 },
            laser:   { name: 'Лазер',     damage: 20,  speed: 60, cooldown: 45, color: '#00ffff', cost: 20000, owned: false, size: 4,  eraReq: 3, pierce: true, laser: true },
            plasma:  { name: 'Плазмоган', damage: 25,  speed: 15, cooldown: 50, color: '#ff00ff', cost: 40000, owned: false, size: 8,  eraReq: 4, homing: true },
            rpg:     { name: 'РПГ',       damage: 50,  speed: 12, cooldown: 80, color: '#95a5a6', cost: 15000, owned: false, size: 11, eraReq: 1, explosive: true, blastRadius: 150 },
            tank:    { name: 'ТАНК',      damage: 100, speed: 10, cooldown: 90, color: '#2c3e50', cost: 50000, owned: false, size: 18, eraReq: 1, explosive: true, blastRadius: 250, isVehicle: true },
            sword:   { name: 'Меч Героя', damage: 10, cooldown: 30, color: '#ecf0f1', cost: 0, owned: false, range: 130, eraReq: 1 }
        };
        let currentWeaponKey = 'pistol';

        const MAX_UPGRADE_COST = 2750;
        function upgradeCost(u) { return Math.min(MAX_UPGRADE_COST, Math.floor(u.cost * Math.pow(1.25, u.lvl))); }

        let upgrades = {
            speed:       { name: 'Скорость',         lvl: 0, cost: 40,  max: 20, val: 0.375 },
            damage:      { name: 'Урон',             lvl: 0, cost: 80,  max: 20, val: 0.25  },
            fireRate:    { name: 'Скорострельность', lvl: 0, cost: 100, max: 20, val: 0.9042 },
            maxHp:       { name: 'Макс. HP',         lvl: 0, cost: 60,  max: 20, val: 15    },
            regen:       { name: 'Регенерация',      lvl: 0, cost: 120, max: 10, val: 0.075 },
            fov:         { name: 'Обзор (Зум)',      lvl: 0, cost: 160, max: 10, val: 0.012 },
            swordDamage: { name: 'Урон Меча',        lvl: 0, cost: 80,  max: 20, val: 3.75  },
            swordRadius: { name: 'Радиус Меча',      lvl: 0, cost: 120, max: 20, val: 15    },
            swordSpeed:  { name: 'Скор. Меча',       lvl: 0, cost: 100, max: 20, val: 0.9466 }
        };

        let compUpgrades = {
            compDamage:   { name: 'Урон Комп.', lvl: 0, cost: 80,  max: 20, val: 0.775  },
            compFireRate: { name: 'Скор. Комп.', lvl: 0, cost: 120, max: 20, val: 0.9466 },
            compMaxHp:    { name: 'HP Комп.',    lvl: 0, cost: 60,  max: 20, val: 15    }
        };

        let player, bullets, bossBullets, monkeyPoops, enemies, particles, explosions, chests, bloodStains, medkits, drops, companion, floatingTexts, slashes;
        let fallingTrees = [];
        let pendingBarrelExplosions = [];
        const pendingBarrelSet = new Set();
        let resumeTimeout = null;
        let eraPopupTimeout = null;
        let camera = { x: 0, y: 0 };
        let score = 0, coins = 0, pinoPieces = 0, hasPinocchioComp = false;
        let gameOver = false, isPaused = false;
        let lastTime = 0, enemySpawnTimer = 0, chestSpawnTimer = 0, swordSpawnTimer = 0, boosterSpawnTimer = 0, gameTime = 0;
        let animationFrameId = null;
        let isGodMode = false;
        let bossWarningTimer = 0, nextBossTime = 0;
        let shakeTime = 0, shakeIntensity = 0;
        let isBossActive = false;
        let speedBoostTimer = 0;
        let awpAutoEnabled = false;

        let destroyedTrees = new Set();
        let treeHp = {};
        let barrelHp = {};

        const keys = {};
        const mouse = { x: 0, y: 0, isDown: false };
        // === ФИКС: игнорируем ввод с поля ввода чит-кодов ===
        window.addEventListener('keydown', e => {
            if (e.target && e.target.tagName === 'INPUT') return;
            keys[e.code] = true; keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false; keys[e.key.toLowerCase()] = false;
        });
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            if (usePcControls && player && !isPaused && !gameOver) {
                let zoom = Math.max(0.2, BASE_ZOOM - (upgrades.fov.lvl * upgrades.fov.val));
                let wmx = mouse.x / zoom + camera.x;
                let wmy = mouse.y / zoom + camera.y;
                aimJoy.angle = Math.atan2(wmy - player.y, wmx - player.x);
            }
        });
        window.addEventListener('mousedown', (e) => { if (e.target === canvas) mouse.isDown = true; });
        window.addEventListener('mouseup', () => { mouse.isDown = false; });

        let moveTouch = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0 };
        let aimJoy = { baseX: 0, baseY: 0, knobX: 0, knobY: 0, active: false, angle: 0, id: null };

        const TILE_SIZE = 128;
        const TAU = Math.PI * 2;
        function pseudoNoise(x, y) { let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return n - Math.floor(n); }

        const tileCache = new Map();
        const TILE_CACHE_MAX = 5000;
        const GRASS_COLORS = ['#3d7235', '#345a2c', '#2e4d27', '#274020', '#1e3318'];

        function getStaticTile(tx, ty) {
            const key = tx + ',' + ty;
            let info = tileCache.get(key);
            if (info) return info;

            info = {};
            info.water = (Math.sin(tx * 0.15) + Math.cos(ty * 0.15)) > 1.75;
            info.isTreeCandidate = false;
            info.isBarrelCandidate = false;

            if (!info.water) {
                if (pseudoNoise(tx, ty) > 0.88) {
                    if (!(pseudoNoise(tx+1, ty) > 0.88 || pseudoNoise(tx-1, ty) > 0.88 || pseudoNoise(tx, ty+1) > 0.88 || pseudoNoise(tx, ty-1) > 0.88)) {
                        info.isTreeCandidate = true;
                    }
                }
                if (!info.isTreeCandidate && pseudoNoise(tx + 500, ty + 500) > 0.975) {
                    info.isBarrelCandidate = true;
                }
                const n = Math.sin(tx * 0.1) * Math.cos(ty * 0.1) + Math.sin(tx * 0.5 + ty * 0.3);
                if (n > 0.7) info.grass = 0;
                else if (n > 0.2) info.grass = 1;
                else if (n > -0.3) info.grass = 2;
                else if (n > -0.7) info.grass = 3;
                else info.grass = 4;

                const n1 = pseudoNoise(tx * 10, ty * 10);
                info.grassDetail = n1 > 0.94 ? 1 : (n1 > 0.82 ? 2 : 0);
                if (info.grassDetail) {
                    info.gdX = pseudoNoise(tx, ty) * (TILE_SIZE - 8);
                    info.gdY = pseudoNoise(ty, tx) * (TILE_SIZE - 16);
                }
                info.flower = pseudoNoise(tx * 5, ty * 5) > 0.96;
                if (info.flower) {
                    info.fX = pseudoNoise(tx+1, ty) * (TILE_SIZE - 4);
                    info.fY = pseudoNoise(ty+1, tx) * (TILE_SIZE - 4);
                }
            }

            tileCache.set(key, info);
            if (tileCache.size > TILE_CACHE_MAX) {
                const firstKey = tileCache.keys().next().value;
                tileCache.delete(firstKey);
            }
            return info;

        function gameLoop(timestamp) {
            if (gameOver || isPaused) return;
            let dt = (timestamp - lastTime) / 16.66; if (dt > 3) dt = 3; lastTime = timestamp; gameTime += dt / 60;
            if (speedBoostTimer > 0) speedBoostTimer -= dt;

            player.update(dt); if (companion) companion.update(dt);

            if (awpAutoEnabled && currentWeaponKey === 'awp' && !gameOver) {
                let nearestEnemy = null; let minDistSq = Infinity;
                for (let e of enemies) {
                    if (e.isDead) continue;
                    let dSq = (e.x - player.x)**2 + (e.y - player.y)**2;
                    if (dSq < minDistSq) { minDistSq = dSq; nearestEnemy = e; }
                }
                if (nearestEnemy) {
                    aimJoy.angle = Math.atan2(nearestEnemy.y - player.y, nearestEnemy.x - player.x);
                    if (player.shootCooldown <= 0) {
                        let wpn = weapons['awp'];
                        let dmgMult = 1 + (upgrades.damage.lvl * upgrades.damage.val);
                        let cdMult = Math.pow(upgrades.fireRate.val, upgrades.fireRate.lvl);
                        if (speedBoostTimer > 0) cdMult *= 0.25;
                        bullets.push(new Bullet(player.x, player.y, aimJoy.angle, wpn, player.inTank, dmgMult));
                        player.shootCooldown = Math.max(2, wpn.cooldown * cdMult);
                    }
                }
            }

            let currentZoom = BASE_ZOOM - (upgrades.fov.lvl * upgrades.fov.val); if (currentZoom < 0.2) currentZoom = 0.2;
            const targetX = player.x - (width / currentZoom) / 2; const targetY = player.y - (height / currentZoom) / 2;
            camera.x += (targetX - camera.x) * 0.1 * dt; camera.y += (targetY - camera.y) * 0.1 * dt;

            let camX = camera.x; let camY = camera.y;
            if (shakeTime > 0) { camX += (Math.random() - 0.5) * shakeIntensity; camY += (Math.random() - 0.5) * shakeIntensity; shakeTime -= dt; }

            const earlyGame = gameTime < EARLY_GAME_TIME;

            enemySpawnTimer += dt;
            let spawnRate = Math.max(25, 90 - Math.floor(score / 5) - Math.floor(gameTime / 2));
            if (earlyGame) spawnRate *= 1.5;
            if (!isBossActive && enemySpawnTimer > spawnRate) {
                let type = 'rabbit'; let r = Math.random();

                else if (era >= 3 && r < 0.15) type = 'kamikaze';
                else if (era >= 2 && r < 0.25) type = 'crow';
                else if (score > 30) {
                    if (r < 0.35) type = 'fox';
                    else if (r < 0.55) type = 'wolf';
                    else if (r < 0.70) type = 'monkey';

                let sdx = player.moveDirX; let sdy = player.moveDirY;

            swordSpawnTimer += dt;

                if (Math.random() < 0.2) { let angle = Math.random() * TAU; let dist = 300 + Math.random() * 400; drops.push(new Drop(player.x + Math.cos(angle)*dist, player.y + Math.sin(angle)*dist, 'sword')); }
                swordSpawnTimer = 0;

            boosterSpawnTimer += dt;

                if (Math.random() < 0.10) {
                    let angle = Math.random() * TAU; let dist = 150 + Math.random() * 350;
                    let types = ['full_heal', 'shield', 'speed_pill'];
                    let type = types[Math.floor(Math.random() * types.length)];
                    drops.push(new Drop(player.x + Math.cos(angle)*dist, player.y + Math.sin(angle)*dist, type));
                }
                boosterSpawnTimer = 0;
            }

            if (gameTime > nextBossTime && !bossWarningTimer && !isBossActive) { bossWarningTimer = 180; warningScreen.style.display = 'block'; nextBossTime = gameTime + 120 + Math.random() * 120; }
            if (bossWarningTimer > 0) {
                bossWarningTimer -= dt;
                if (bossWarningTimer <= 0) {
                    warningScreen.style.display = 'none';
                    for (let i = enemies.length - 1; i >= 0; i--) {
                        if (enemies[i].type !== 'boar_boss') enemies.splice(i, 1);
                    }
                    let angle = Math.random() * TAU;
                    enemies.push(new Enemy('boar_boss', Math.cos(angle), Math.sin(angle)));
                }
            }

            let worldRight = camera.x + (width / currentZoom) + 1000; let worldLeft = camera.x - 1000; let worldBottom = camera.y + (height / currentZoom) + 1000; let worldTop = camera.y - 1000;
            const dmgMult = difficultySettings[difficulty].dmgMult * eraDmgMult();
            const earlyDmgMul = earlyGame ? 0.5 : 1;

            for (let i = pendingBarrelExplosions.length - 1; i >= 0; i--) {
                const p = pendingBarrelExplosions[i];
                if (destroyedTrees.has(p.key)) {
                    pendingBarrelSet.delete(p.key);
                    pendingBarrelExplosions.splice(i, 1);
                    continue;
                }
                p.delay -= dt;
                if (p.delay <= 0) {
                    destroyedTrees.add(p.key);
                    pendingBarrelSet.delete(p.key);
                    pendingBarrelExplosions.splice(i, 1);
                    createExplosion(p.x, p.y, p.radius, p.damage);
                }
            }

            for (let i = fallingTrees.length - 1; i >= 0; i--) {
                fallingTrees[i].time += dt;
                if (fallingTrees[i].time >= 60) fallingTrees.splice(i, 1);
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; if (!b.active) { bullets.splice(i, 1); continue; } b.update(dt);
                if (b.x < worldLeft || b.x > worldRight || b.y < worldTop || b.y > worldBottom) { bullets.splice(i, 1); continue; }
                let btx = Math.floor(b.x / TILE_SIZE); let bty = Math.floor(b.y / TILE_SIZE);
                if (isBarrel(btx, bty)) { let key = 'barrel_' + btx + ',' + bty; if (!barrelHp[key]) barrelHp[key] = 1; barrelHp[key] -= b.damage; b.active = false; if (barrelHp[key] <= 0) { destroyedTrees.add(btx + ',' + bty); createExplosion(btx * TILE_SIZE + TILE_SIZE/2, bty * TILE_SIZE + TILE_SIZE/2, 200, 100); } continue; }
                if (isTree(btx, bty)) {
                    b.active = false; let key = btx + ',' + bty; if (!treeHp[key]) treeHp[key] = 20; treeHp[key] -= b.damage;
                    for(let p=0; p<3; p++) particles.push(new Particle(b.x, b.y, '#4a2e15', 3));
                    if (treeHp[key] <= 0) { destroyTree(btx, bty, btx * TILE_SIZE + TILE_SIZE/2, bty * TILE_SIZE + TILE_SIZE/2); }
                    continue;
                }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j]; if (e.isDead || b.hitEnemies.has(e)) continue;
                    let dSq = (e.x - b.x)*(e.x - b.x) + (e.y - b.y)*(e.y - b.y);
                    if (dSq < (e.radius + b.radius)*(e.radius + b.radius)) {
                        if (b.explosive) { createExplosion(b.x, b.y, b.blastRadius, b.damage); b.active = false; break; }
                        else {
                            damageEnemy(e, b.damage);
                            if (b.pierce) { b.damage /= 2; b.hitEnemies.add(e); }
                            else { b.active = false; break; }
                        }
                    }
                }
            }
            if (bullets.length > 200) bullets.splice(0, bullets.length - 200);

            // === ОБРАБОТКА СНАРЯДОВ БОССА (с отражением) ===
            for (let i = bossBullets.length - 1; i >= 0; i--) {
                const bb = bossBullets[i]; bb.update(dt);
                if (bb.life <= 0) { bossBullets.splice(i, 1); continue; }
                if (bb.reflected) {
                    // отражённый — урон врагам, игроку не вредит
                    let hit = false;
                    for (let e of enemies) {
                        if (e.isDead) continue;
                        let dSqE = (e.x - bb.x)**2 + (e.y - bb.y)**2;
                        if (dSqE < (bb.radius + e.radius)**2) {
                            damageEnemy(e, bb.reflectedDamage || 40);
                            hit = true;
                            for (let p = 0; p < 10; p++) particles.push(new Particle(bb.x, bb.y, '#ffcc00', 6));
                            break;
                        }
                    }
                    if (hit) { bossBullets.splice(i, 1); }
                } else {
                    // обычный — урон игроку
                    let dSq = (player.x - bb.x)**2 + (player.y - bb.y)**2;
                    if (dSq < (bb.radius + player.radius)**2) {
                        if (!isGodMode && !player.inTank) {
                            let dmg = 25 * dmgMult * earlyDmgMul;
                            if (player.shield > 0) { let absorbed = Math.min(player.shield, dmg); player.shield -= absorbed; dmg -= absorbed; uiShield.innerText = Math.floor(player.shield); }
                            if (dmg > 0) { player.hp -= dmg; uiHp.innerText = Math.floor(player.hp); player._lastHpShown = Math.floor(player.hp); if (player.hp <= 0) { endGame(); return; } }
                        }
                        bossBullets.splice(i, 1);
                    }
                }
            }

            // === ОБРАБОТКА КАКАШЕК (с отражением) ===
            for (let i = monkeyPoops.length - 1; i >= 0; i--) {
                const mp = monkeyPoops[i]; mp.update(dt);
                if (mp.life <= 0) { monkeyPoops.splice(i, 1); continue; }
                if (mp.reflected) {
                    let hit = false;
                    for (let e of enemies) {
                        if (e.isDead) continue;
                        let dSqE = (e.x - mp.x)**2 + (e.y - mp.y)**2;
                        if (dSqE < (mp.radius + e.radius)**2) {
                            damageEnemy(e, mp.reflectedDamage || 40);
                            hit = true;
                            for (let p = 0; p < 8; p++) particles.push(new Particle(mp.x, mp.y, '#ffcc00', 5));
                            break;
                        }
                    }
                    if (hit) { monkeyPoops.splice(i, 1); }
                } else {
                    let dSq = (player.x - mp.x)**2 + (player.y - mp.y)**2;
                    if (dSq < (mp.radius + player.radius)**2) {
                        if (player.inTank) {
                            player.tankHp -= 8;
                            if (player.tankHp <= 0) { player.inTank = false; weapons.tank.owned = false; explosions.push(new Explosion(player.x, player.y, 150)); alert("ТАНК УНИЧТОЖЕН! Купите новый в магазине."); equipWeapon('pistol'); }
                        } else if (!isGodMode) {
                            let dmg = 15 * dmgMult * earlyDmgMul;
                            if (player.shield > 0) { let absorbed = Math.min(player.shield, dmg); player.shield -= absorbed; dmg -= absorbed; uiShield.innerText = Math.floor(player.shield); }
                            if (dmg > 0) { player.hp -= dmg; uiHp.innerText = Math.floor(player.hp); player._lastHpShown = Math.floor(player.hp); if (player.hp <= 0) { endGame(); return; } }
                        }
                        for (let p = 0; p < 8; p++) particles.push(new Particle(mp.x, mp.y, '#5d3a1a', 5));
                        monkeyPoops.splice(i, 1);
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i]; e.update(dt);
                if (e.isDead && e.deathTimer <= 0) { enemies.splice(i, 1); continue; }
                if (!e.isDead) {
                    let dSq = (e.x - player.x)*(e.x - player.x) + (e.y - player.y)*(e.y - player.y);
                    let isColliding = dSq < (e.radius + player.radius)*(e.radius + player.radius);
                    if (e.type === 'kamikaze') isColliding = false;
                    if (isColliding) {
                        if (player.inTank) {
                            damageEnemy(e, 9999); player.tankHp -= (e.type === 'boar_boss' ? 50 : 15);
                            if (player.tankHp <= 0) { player.inTank = false; weapons.tank.owned = false; explosions.push(new Explosion(player.x, player.y, 150)); alert("ТАНК УНИЧТОЖЕН! Купите новый в магазине."); equipWeapon('pistol'); }
                        } else if (!isGodMode) {
                            let baseDmg = (e.type === 'boar_boss' ? 50 : (e.type === 'ghost' ? 25 : 10));
                            let dmg = baseDmg * dmgMult * earlyDmgMul;
                            if (player.shield > 0) { let absorbed = Math.min(player.shield, dmg); player.shield -= absorbed; dmg -= absorbed; uiShield.innerText = Math.floor(player.shield); }
                            if (dmg > 0) { player.hp -= dmg; uiHp.innerText = Math.floor(player.hp); player._lastHpShown = Math.floor(player.hp); if (player.hp <= 0) { endGame(); return; } }
                            e.x += Math.cos(e.angle) * -50; e.y += Math.sin(e.angle) * -50;
                        } else { damageEnemy(e, 9999); }
                    }
                    if (companion && !companion.isDead) {
                        let dSqC = (e.x - companion.x)*(e.x - companion.x) + (e.y - companion.y)*(e.y - companion.y);
                        if (dSqC < (e.radius + companion.radius)*(e.radius + companion.radius)) {
                            companion.hp -= (e.type === 'boar_boss' ? 50 : 10);
                            e.x += Math.cos(e.angle) * -50; e.y += Math.sin(e.angle) * -50;
                            if (companion.hp <= 0) { companion.isDead = true; companion.respawnTimer = 300; floatingTexts.push(new FloatingText(companion.x, companion.y, "Димас пал!", "#ff4444")); }
                        }
                    }
                }
            }

            let ptx = Math.floor(player.x / TILE_SIZE); let pty = Math.floor(player.y / TILE_SIZE);
            if (isBarrel(ptx, pty)) {
                let bx = ptx * TILE_SIZE + TILE_SIZE/2; let by = pty * TILE_SIZE + TILE_SIZE/2;
                if (Math.hypot(player.x - bx, player.y - by) < TILE_SIZE/2) {
                    destroyedTrees.add(ptx + ',' + pty);
                    createExplosion(bx, by, 200, 50);
                }
            }

            for (let i = drops.length - 1; i >= 0; i--) {
                const d = drops[i]; d.update(dt);
                if ((d.x - player.x)**2 + (d.y - player.y)**2 < (d.radius + player.radius)**2) {
                    if (d.type === 'pinocchio') {
                        if (pinoPieces < 7) { pinoPieces++; pinoPiecesUI.innerText = pinoPieces; if (pinoPieces === 7 && !hasPinocchioComp) { hasPinocchioComp = true; companion = new Companion('dimas'); alert("ВЫ СОБРАЛИ ДИМАСА! Теперь он ваш компаньон с Диглом."); } }
                        else { coins += 100; uiCoins.innerText = coins; floatingTexts.push(new FloatingText(d.x, d.y - 20, "+100 🪙", "#f1c40f")); }
                    } else if (d.type === 'sword') { weapons.sword.owned = true; equipWeapon('sword'); alert("ВЫ НАШЛИ МЕЧ ГЕРОЯ! Он в руках."); }
                    else if (d.type === 'full_heal') { player.hp = player.maxHp; uiHp.innerText = player.hp; player._lastHpShown = Math.floor(player.hp); floatingTexts.push(new FloatingText(d.x, d.y - 20, "FULL HP!", "#2ecc71")); for(let p=0; p<15; p++) particles.push(new Particle(d.x, d.y, '#e74c3c', 6)); }
                    else if (d.type === 'shield') { player.shield += 100; uiShield.innerText = Math.floor(player.shield); floatingTexts.push(new FloatingText(d.x, d.y - 20, "+100 ЩИТ", "#3498db")); for(let p=0; p<15; p++) particles.push(new Particle(d.x, d.y, '#3498db', 6)); }
                    else if (d.type === 'speed_pill') { speedBoostTimer = 12 * 60; floatingTexts.push(new FloatingText(d.x, d.y - 20, "x4 СКОРОСТЬ!", "#2ecc71")); for(let p=0; p<15; p++) particles.push(new Particle(d.x, d.y, '#2ecc71', 6)); }
                    for(let p=0; p<8; p++) particles.push(new Particle(d.x, d.y, d.type === 'pinocchio' ? '#f1c27d' : (d.type === 'sword' ? '#f1c40f' : '#fff'), 4));
                    drops.splice(i, 1);
                }
            }

            chestSpawnTimer += dt;
            if (chestSpawnTimer > 800 && chests.length < 2) { let a = Math.random()*TAU; let d = 400+Math.random()*600; chests.push(new Chest(player.x + Math.cos(a)*d, player.y + Math.sin(a)*d)); chestSpawnTimer = 0; }
            for (let i = chests.length - 1; i >= 0; i--) {
                const c = chests[i];
                if ((c.x - player.x)**2 + (c.y - player.y)**2 < (c.radius + player.radius)**2) { let m = Math.floor((Math.random() * 900 + 100) * eraRewardMult()); coins += m; uiCoins.innerText = coins; floatingTexts.push(new FloatingText(c.x, c.y, "+" + m + " 🪙", "#f1c40f")); for(let p=0; p<15; p++) particles.push(new Particle(c.x, c.y, '#f1c40f', 6)); chests.splice(i, 1); }
            }

            for (let i = medkits.length - 1; i >= 0; i--) {
                const m = medkits[i];
                if ((m.x - player.x)**2 + (m.y - player.y)**2 < (m.radius + player.radius)**2) { player.hp += 25; if (player.hp > player.maxHp) player.hp = player.maxHp; uiHp.innerText = Math.floor(player.hp); player._lastHpShown = Math.floor(player.hp); floatingTexts.push(new FloatingText(m.x, m.y, "+25 HP", "#2ecc71")); for(let p=0; p<8; p++) particles.push(new Particle(m.x, m.y, '#fff', 6)); medkits.splice(i, 1); }
            }

            for (let i = slashes.length - 1; i >= 0; i--) { slashes[i].update(dt); if (slashes[i].life <= 0) slashes.splice(i, 1); }
            for (let i = floatingTexts.length - 1; i >= 0; i--) { floatingTexts[i].update(dt); if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1); }
            for (let i = bloodStains.length - 1; i >= 0; i--) { bloodStains[i].life -= 0.005 * dt; if (bloodStains[i].life <= 0) bloodStains.splice(i, 1); }
            for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(dt); if (particles[i].life <= 0) particles.splice(i, 1); }
            for (let i = explosions.length - 1; i >= 0; i--) { explosions[i].update(dt); if (explosions[i].life <= 0) explosions.splice(i, 1); }

            ctx.fillStyle = '#1e3318'; ctx.fillRect(0, 0, width, height);
            ctx.save(); ctx.scale(currentZoom, currentZoom); ctx.translate(-Math.round(camX), -Math.round(camY));

            let startTX = Math.floor(camera.x / TILE_SIZE) - 1;
            let endTX = Math.floor((camera.x + width/currentZoom) / TILE_SIZE) + 1;
            let startTY = Math.floor(camera.y / TILE_SIZE) - 1;
            let endTY = Math.floor((camera.y + height/currentZoom) / TILE_SIZE) + 1;

            for(let tx = startTX; tx <= endTX; tx++) {
                for(let ty = startTY; ty <= endTY; ty++) {
                    let x = tx * TILE_SIZE; let y = ty * TILE_SIZE;
                    const t = getStaticTile(tx, ty);
                    if (t.water) {
                        ctx.fillStyle = '#1f5f8b'; ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = 'rgba(120, 200, 240, 0.2)';
                        ctx.fillRect(x + 10, y + 20, TILE_SIZE - 20, 3);
                        ctx.fillRect(x + 30, y + 60, TILE_SIZE - 40, 3);
                        ctx.fillRect(x + 15, y + 95, TILE_SIZE - 30, 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                        ctx.fillRect(x + 25, y + 40, TILE_SIZE - 50, 2);
                    } else {
                        ctx.fillStyle = GRASS_COLORS[t.grass];
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        if (t.grassDetail) {
                            ctx.fillStyle = t.grassDetail === 1 ? '#4a8a3e' : '#3a6b32';
                            ctx.fillRect(x + t.gdX, y + t.gdY, 5, 11);
                        }
                        if (t.flower) {
                            ctx.fillStyle = '#f1c40f';
                            ctx.fillRect(x + t.fX, y + t.fY, 4, 4);
                        }
                    }
                }
            }

            bloodStains.forEach(b => { ctx.globalAlpha = Math.max(0, b.life); ctx.fillStyle = b.color; ctx.fillRect(b.x - b.size/2, b.y - b.size/2, b.size, b.size); });
            ctx.globalAlpha = 1;

            for(let tx = startTX; tx <= endTX; tx++) {
                for(let ty = startTY; ty <= endTY; ty++) {
                    if (isBarrel(tx, ty)) {
                        let cx = tx * TILE_SIZE + TILE_SIZE/2;
                        let cy = ty * TILE_SIZE + TILE_SIZE/2;
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath(); ctx.ellipse(cx, cy + 25, 26, 9, 0, 0, TAU); ctx.fill();
                        const bw = 42, bh = 58;
                        ctx.fillStyle = '#8B4513';
                        ctx.fillRect(cx - bw/2, cy - bh/2, bw, bh);
                        ctx.fillStyle = '#5a2e0e';
                        ctx.fillRect(cx - bw/2, cy - bh/2, bw, 9);
                        ctx.fillRect(cx - bw/2, cy + bh/2 - 9, bw, 9);
                        ctx.fillStyle = '#2c2c2c';
                        ctx.fillRect(cx - bw/2, cy - bh/2 + 16, bw, 4);
                        ctx.fillRect(cx - bw/2, cy + bh/2 - 20, bw, 4);
                    }
                    if (isTree(tx, ty)) {
                        let cx = tx * TILE_SIZE + TILE_SIZE/2;
                        let cy = ty * TILE_SIZE + TILE_SIZE/2;
                        ctx.fillStyle = 'rgba(0,0,0,0.3)';
                        ctx.beginPath(); ctx.arc(cx, cy + 30, 45, 0, TAU); ctx.fill();
                        if (treeImage.complete && treeImage.naturalWidth > 0) {
                            const aspect = treeImage.width / treeImage.height;
                            const drawH = TREE_DRAW_HEIGHT;
                            const drawW = drawH * aspect;
                            const dx = cx - drawW/2;
                            const dy = cy + TREE_GROUND_OFFSET - drawH;
                            ctx.drawImage(treeImage, dx, dy, drawW, drawH);
                        } else {
                            drawGrayBox(cx, cy - 60, 90);
                        }
                    }
                }
            }

            if (treeImage.complete && treeImage.naturalWidth > 0) {
                for (const ft of fallingTrees) {
                    const progress = Math.min(1, ft.time / 60);
                    const alpha = 1 - progress * 0.9;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.translate(ft.x, ft.y + TREE_GROUND_OFFSET);
                    ctx.rotate(ft.dir * progress * Math.PI / 2);
                    const aspect = treeImage.width / treeImage.height;
                    const drawH = TREE_DRAW_HEIGHT;
                    const drawW = drawH * aspect;
                    ctx.drawImage(treeImage, -drawW/2, -drawH, drawW, drawH);
                    ctx.restore();
                }
            }
            ctx.globalAlpha = 1;

            drops.forEach(d => d.draw());
            explosions.forEach(e => e.draw());
            medkits.forEach(m => m.draw());
            chests.forEach(c => c.draw());
            particles.forEach(p => p.draw());
            bullets.forEach(b => b.draw());
            slashes.forEach(s => s.draw());
            enemies.forEach(e => e.draw());
            bossBullets.forEach(bb => bb.draw());
            monkeyPoops.forEach(mp => mp.draw());
            if (companion) companion.draw();
            player.draw();
            floatingTexts.forEach(f => f.draw());

            const showAimLine = aimJoy.active || mouse.isDown || awpAutoEnabled || (usePcControls && !useTouchControls);
            if (showAimLine) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.15)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(player.x, player.y);
                ctx.lineTo(player.x + Math.cos(aimJoy.angle) * 2000, player.y + Math.sin(aimJoy.angle) * 2000);
                ctx.stroke();
            }

            ctx.restore();
            drawTouchControls();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function drawTouchControls() {
            if (!useTouchControls) return;
            if (moveTouch.active) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.beginPath(); ctx.arc(moveTouch.startX, moveTouch.startY, 50, 0, TAU); ctx.fill();
                let dx = moveTouch.x - moveTouch.startX; let dy = moveTouch.y - moveTouch.startY; let dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > 50) { dx = (dx/dist)*50; dy = (dy/dist)*50; }
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.beginPath(); ctx.arc(moveTouch.startX + dx, moveTouch.startY + dy, 20, 0, TAU); ctx.fill();
            }
            if (aimJoy.active) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.2)'; ctx.beginPath(); ctx.arc(aimJoy.baseX, aimJoy.baseY, 50, 0, TAU); ctx.fill();
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(aimJoy.baseX, aimJoy.baseY, 50, 0, TAU); ctx.stroke();
                ctx.fillStyle = 'rgba(255, 50, 50, 0.7)'; ctx.beginPath(); ctx.arc(aimJoy.knobX, aimJoy.knobY, 25, 0, TAU); ctx.fill();
            }
        }

        function endGame() {
            gameOver = true;
            deathScreen.style.display = 'flex';
            restartBtn.style.display = 'block';
            mainMenuBtn.style.display = 'block';
            shopBtn.style.display = 'none';
            upgradeBtn.style.display = 'none';
            compUpgradeBtn.style.display = 'none';
            awpAutoBtn.style.display = 'none';
            warningScreen.style.display = 'none';
            if (resumeTimeout) { clearTimeout(resumeTimeout); resumeTimeout = null; }
            if (eraPopupTimeout) { clearTimeout(eraPopupTimeout); eraPopupTimeout = null; }
            resumeOverlay.style.display = 'none';
            eraPopup.style.display = 'none';
            mouse.isDown = false;
        }
        function addBtnListener(btn, cb) { btn.addEventListener('click', (e) => { e.preventDefault(); cb(); }); btn.addEventListener('touchstart', (e) => { e.preventDefault(); cb(); }, { passive: false }); }

        addBtnListener(playBtn, startGame);
        addBtnListener(restartBtn, startGame);
        addBtnListener(menuShopBtn, () => { shopMenu.style.display='flex'; updateShopUI(); });
        addBtnListener(shopBtn, () => { shopMenu.style.display='flex'; isPaused = true; mouse.isDown = false; updateShopUI(); });
        addBtnListener(upgradeBtn, () => { upgradeMenu.style.display='flex'; isPaused = true; mouse.isDown = false; updateUpgradeUI(); });
        addBtnListener(compUpgradeBtn, () => { compUpgradeMenu.style.display='flex'; isPaused = true; mouse.isDown = false; updateCompUpgradeUI(); });
        // === ЧИТ-КОДЫ: теперь открывают модалку ===
        addBtnListener(cheatBtn, openCheatMenu);
        addBtnListener(mainMenuBtn, () => { deathScreen.style.display = 'none'; restartBtn.style.display = 'none'; mainMenuBtn.style.display = 'none'; uiContainer.style.display = 'none'; shopBtn.style.display = 'none'; upgradeBtn.style.display = 'none'; compUpgradeBtn.style.display = 'none'; awpAutoBtn.style.display = 'none'; mainMenu.style.display = 'flex'; gameOver = true; applyInputMode(); });

        canvas.addEventListener('touchstart', (e) => {
            if (!useTouchControls) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX < window.innerWidth / 2 && !moveTouch.active) {
                    moveTouch = { active: true, id: touch.identifier, startX: touch.clientX, startY: touch.clientY, x: touch.clientX, y: touch.clientY };
                } else if (touch.clientX >= window.innerWidth / 2 && !aimJoy.active) {
                    aimJoy.active = true; aimJoy.id = touch.identifier;
                    aimJoy.knobX = aimJoy.baseX; aimJoy.knobY = aimJoy.baseY;
                    updateAim(touch.clientX, touch.clientY);
                }
            }
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            if (!useTouchControls) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (moveTouch.active && touch.identifier === moveTouch.id) { moveTouch.x = touch.clientX; moveTouch.y = touch.clientY; }
                if (aimJoy.active && touch.identifier === aimJoy.id) updateAim(touch.clientX, touch.clientY);
            }
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            if (!useTouchControls) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (moveTouch.active && touch.identifier === moveTouch.id) { moveTouch.active = false; if (player) { player.moveDirX = 0; player.moveDirY = 0; } }
                if (aimJoy.active && touch.identifier === aimJoy.id) aimJoy.active = false;
            }
        }, { passive: false });

        function updateAim(touchX, touchY) {
            let dx = touchX - aimJoy.baseX; let dy = touchY - aimJoy.baseY;
            aimJoy.angle = Math.atan2(dy, dx);
            let dist = Math.sqrt(dx*dx + dy*dy);
            let visualDist = Math.min(dist, 40);
            aimJoy.knobX = aimJoy.baseX + Math.cos(aimJoy.angle) * visualDist;
            aimJoy.knobY = aimJoy.baseY + Math.sin(aimJoy.angle) * visualDist;
        }

        resize();
        aimJoy.baseX = width - 100; aimJoy.baseY = height - 100;
        aimJoy.knobX = aimJoy.baseX; aimJoy.knobY = aimJoy.baseY;
    </script>
